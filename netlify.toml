# Nitro SSR. `nuxt generate` would omit POST /api/__session, and a hard refresh of a
# gated page would send a signed-in user to login.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # @clack/* and other toolchain expect Node >= 20.12 (styleText, etc.). Matches CI.
  NODE_VERSION = "22"
